
user  nginx;                                                                                                            
# The user directive sets the system user that the worker processes will run as.
# 'nginx' is a common user created for running the nginx worker processes with
# reduced privileges.
worker_processes  auto;   
# worker_processes controls the number of worker processes. 'auto' lets nginx
# choose a sensible value (usually based on available CPU cores).

error_log  /var/log/nginx/error.log notice;                                                                           
# error_log specifies the path and log level for nginx error messages.
# 'notice' is a moderate verbosity level useful for operational messages.
pid        /run/nginx.pid;      
# pid sets the file where the master process writes its process id. This is
# used by system tools and init scripts to manage the nginx process.

events {
        # The events block contains directives related to connection processing.
        # worker_connections defines the maximum number of simultaneous
        # connections that a worker process can handle.
        worker_connections  1024;
}

http {
    # The http block enables HTTP server functionality and contains
    # configuration for servers, upstreams, logging, and more.

    server{
        # Define a server (virtual host) to listen for incoming HTTP requests.
        listen 80; # Listen on port 80 for plain HTTP.
        server_name _; # '_' is a catch-all server_name for unspecified hosts.

        # The location block specifies how to process requests for a URI.
        location / {
            # Forward all requests to a backend application running at
            # host.docker.internal:5000 (useful when nginx runs in a container)
            proxy_pass http://host.docker.internal:5000;

            # Preserve the original Host header from the client.
            proxy_set_header Host $host;

            # Forward the client's IP address in a custom header.
            proxy_set_header X-Real_IP $remote_addr;

            # Preserve the chain of forwarding proxies in the standard header.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inform the backend whether the original request used HTTP or HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}